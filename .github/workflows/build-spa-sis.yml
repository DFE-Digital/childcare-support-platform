name: Build Single page app + Spatial Index Service

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      environment:
        description: "Target Environment"
        required: true
        default: "Dev"
        type: string
      STORAGE_GROUP_NAME:
        description: "The name of the resource group the storage account is in"
        required: true
        type: string
      STORAGE_ACCOUNT_NAME:
        description: "The name of the storage account with the source data"
        required: true
        type: string
      STORAGE_CONTAINER_NAME:
        description: "The name of the storage container the build data is in"
        required: true
        type: string
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

jobs:
  build:
    environment: Dev
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Unlock source data container
        shell: bash
        run: |
          chmod +x infrastructure/scripts/manage-storage-access.sh
          ./infrastructure/scripts/manage-storage-access.sh "${{ inputs.STORAGE_ACCOUNT_NAME }}" "${{ inputs.STORAGE_GROUP_NAME }}" "true"

      - name: Fetch exported data from blob storage
        run: |
          mkdir -p exported_data

          az storage copy \
            -s https://${{ inputs.STORAGE_ACCOUNT_NAME }}.blob.core.windows.net/${{ inputs.STORAGE_CONTAINER_NAME }}/app \
            -d exported_data/ \
            --recursive

      - name: Populate .docker-data for Docker build context
        run: |
          mkdir -p .docker-data/app
          cp -r ./exported_data/app ./.docker-data/

      - name: Lock source data container
        if: ${{ always() }}
        shell: bash
        run: |
          chmod +x infrastructure/scripts/manage-storage-access.sh
          ./infrastructure/scripts/manage-storage-access.sh "${{ inputs.STORAGE_ACCOUNT_NAME }}" "${{ inputs.STORAGE_GROUP_NAME }}" "false"

      - name: Setup docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build bsil-test image
        run: |
          docker buildx build \
            --target test \
            --tag bsil-test \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --load \
            .
        
      - name: Generate SIS file and Schema
        run: |
          CID=$(docker create bsil-test \
          sh -c "SIS_FILEPATH=/tmp/spatial_index.sis \
                 SIS_SCHEMA_JSON_PATH=/tmp/sis_schema.json \
                 SIS_BBOX_INFLATION=1 \
                 SIS_RESULT_LIMIT=500 \
                 sis-preprocess /tmp/spatial_index.parquet")
          docker cp exported_data/app/spatial_index.parquet $CID:/tmp/spatial_index.parquet
          docker start -a $CID
          docker cp $CID:/tmp/spatial_index.sis exported_data/app/spatial_index.sis
          docker cp $CID:/tmp/sis_schema.json exported_data/app/sis_schema.json
          docker rm $CID

      - name: Prepare filesystem
        run: |
          mkdir -p packages/spatial-index-service/target/sis-bundle
          mkdir -p packages/spatial-index-service/target/sis-bundle/spatial-query
          mkdir -p packages/spatial-index-service/target/sis-bundle/health
          docker rm bsil-lambda-extract 2>/dev/null || true

      - name: Build spatial index service image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --target lambda-builder \
            --tag bsil-lambda-builder \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --load \
            .

      - name: Bundle spatial index service
        run: |
          docker create --platform linux/amd64 --name bsil-lambda-extract bsil-lambda-builder
          docker cp bsil-lambda-extract:/usr/local/bin/sis-query-lambda \
            packages/spatial-index-service/target/sis-bundle/handler
          docker rm bsil-lambda-extract

          cp packages/spatial-index-service/host.json \
            packages/spatial-index-service/target/sis-bundle/host.json
          cp packages/spatial-index-service/spatial-query/function.json \
            packages/spatial-index-service/target/sis-bundle/spatial-query/function.json
          cp packages/spatial-index-service/health/function.json \
            packages/spatial-index-service/target/sis-bundle/health/function.json
          cp exported_data/app/spatial_index.sis \
            packages/spatial-index-service/target/sis-bundle/spatial_index.sis

          cd packages/spatial-index-service/target/sis-bundle && \
            zip -r ../sis-bundle.zip handler start.sh spatial_index.sis host.json spatial-query/ health/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: spatial-index-service
          path: packages/spatial-index-service/target/sis-bundle.zip

      - name: Extract frontend dist from image
        run: |
          docker rm bsil-frontend-extract 2>/dev/null || true
          docker create --name bsil-frontend-extract bsil-test
          mkdir -p packages/app/dist
          docker cp bsil-frontend-extract:/app/packages/app/dist/. packages/app/dist/
          docker rm bsil-frontend-extract

      # - name: Package dist folder
        # Bundle everything except the index.html file into a zip
        # run: |
          # cd packages/app/dist
          # zip -r dist.zip * -x index.html

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: frontend
          path: packages/app/dist
