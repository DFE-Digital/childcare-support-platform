name: build-sis

on:
  push:
    paths: 
      - "packages/spatial-index-service/**"
      - ".github/workflows/build-spatial-index-service.yml" # Temporary - just for development purposes
  
permissions:
  id-token: write
  contents: read

jobs:
  build-sis:
    name: build-sis
    environment: Dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Set environment config
        id: config
        run: |
          # Set the environment config here
          # With things like the Azure Storage Container Name / Id
          echo "source_data=s288d01stc-ukw-sourcedata" >> $GITHUB_OUTPUT

      - name: Fetch exported data from blob storage
        run: |
          mkdir -p exported_data/app
          # I think that this is the equivalent to the AWS command
          # aws s3 sync s3://my-s3-bucket-url --delete
          az storage blob download-batch \
            -d exported_data/app/ \
            -s ${{ steps.config.outputs.source_data }} \ # TODO: Make this a variable
            --pattern "app/*" \
            --overwrite true

      - name: Populate .docker-data for Docker build context
        run: |
          mkdir -p .docker-data/app
          cp -r ./exported_data/app/ .docker-data/app/

      - name: Prepare filesystem
        run: |
          mkdir -p packages/spatial-index-service/target/sis-bundle
          # attempt to remove the directory if it exists, we don't care if it fails
          docker rm bsil-lambda-extract 2>/dev/null || true

      - name: Build spatial index service image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --target lambda-builder \
            --tag bsil-lambda-builder \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --load \
            .

      - name: Bundle spatial index service
        run: |
          docker create --platform linux/amd64 --name bsil-lambda-extract bsil-lambda-builder
          docker cp bsil-lambda-extract:/usr/local/bin/sis-query-lambda \
            packages/spatial-index-service/target/sis-bundle/handler
          docker rm bsil-lambda-extract
          cp exported_data/app/spatial_index.sis \
            packages/spatial-index-service/target/sis-bundle/spatial_index.sis
          cd packages/spatial-index-service/target/sis-bundle && \
            zip -j ../sis-bundle.zip hander spatial_index.sis