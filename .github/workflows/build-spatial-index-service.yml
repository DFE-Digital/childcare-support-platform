name: build-spatial-index-service

on:
  workflow_dispatch:
  workflow_call:
  push:
    paths:
      - ".github/workflows/build-spatial-index-service.yml" # Temporary - only for debugging purposes
      - ".github/workflows/build-bsil-test.yml" # Temporary - only for debugging purposes

permissions:
  id-token: write
  contents: read

jobs:
  build-bsil-test:
    uses: ./.github/workflows/build-bsil-test.yml
    secrets:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    permissions:
      id-token: write
      contents: read

  build-spatial-index-service:
    environment: Dev
    runs-on: ubuntu-latest
    needs: [build-bsil-test]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set environment config
        id: config
        run: |
          # Set the environment config here
          # With things like the Azure Storage Container Name / Id
          # TODO: Change this to be an actual variable rather than hard-coded
          echo "source_data=s288d01stc-ukw-sourcedata" >> $GITHUB_OUTPUT
          echo "storage_account_name=cccepfdatastoredev" >> $GITHUB_OUTPUT
          echo "resource_group=s288d01rg-ukw-data" >> $GITHUB_OUTPUT

      # Run the sis-preprocessor inside a container and copy the result out
      - name: Generate spatial_index.sis and sis_schema.json
        run: |
          CID=$(docker create bsil-test \
          sh -c "SIS_FILEPATH=/tmp/spatial_index.sis \
                 SIS_SCHEMA_JSON_PATH=/tmp/sis_schema.json \
                 SIS_BBOX_INFLATION=1 \
                 SIS_RESULT_LIMIT=500 \
                 sis-preprocess /tmp/spatial_index.parquet")
          docker cp exported_data/app/spatial_index.parquet $CID:/tmp/spatial_index.parquet
          docker start -a $CID
          docker cp $CID:/tmp/spatial_index.sis exported_data/app/spatial_index.sis
          docker cp $CID:/tmp/sis_schema.json exported_data/app/sis_schema.json
          docker rm $CID

      - name: Prepare filesystem
        run: |
          mkdir -p packages/spatial-index-service/target/sis-bundle
          # attempt to remove the directory if it exists, we don't care if it fails
          docker rm bsil-lambda-extract 2>/dev/null || true

      - name: Build spatial index service image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --target lambda-builder \
            --tag bsil-lambda-builder \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --load \
            .

      - name: Bundle spatial index service
        run: |
          docker create --platform linux/amd64 --name bsil-lambda-extract bsil-lambda-builder
          docker cp bsil-lambda-extract:/usr/local/bin/sis-query-lambda \
            packages/spatial-index-service/target/sis-bundle/handler
          docker rm bsil-lambda-extract
          cp exported_data/app/spatial_index.sis \
            packages/spatial-index-service/target/sis-bundle/spatial_index.sis
          cd packages/spatial-index-service/target/sis-bundle && \
            zip -j ../sis-bundle.zip hander spatial_index.sis

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: spatial-index-service
          path: packages/spatial-index-service/target/sis-bundle.zip