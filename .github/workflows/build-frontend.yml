name: build-frontend

on:
  push:
    paths:
      - ".github/workflows/build-frontend.yml" # Temporary - only for debugging purposes 

permissions:
  id-token: write
  contents: read

jobs:
  build-bsil-test:
    uses: ./.github/workflows/build-bsil-test.yml
    permissions:
      id-token: write
      contents: read

  build-frontend:
    environment: Dev
    runs-on: ubuntu-latest
    needs: [build-bsil-test]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract frontend dist from image
        run: |
          docker rm bsil-frontend-extract 2>/dev/null || true
          docker create --name bsil-frontend-extract bsil-test
          mkdir -p packages/app/dist
          docker cp bsil-frontend-extract:/app/packages/app/dist/. packages/app/dist/
          docker rm bsil-frontend-extract

      - name: Package dist folder
        # Bundle everything except the index.html file into a zip
        run: zip dist.zip * -x index.html

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: frontend
          path: |
            dist.zip
            index.html
