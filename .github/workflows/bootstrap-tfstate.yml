name: Deploy Azure Bootstrap

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'development'
        type: choice
        options:
          - Dev
          - Test

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Workflow Service Principal Object ID
        id: get-sp-id
        run: |
          SP_OBJECT_ID=$(az ad sp show --id ${{ secrets.AZURE_CLIENT_ID }} --query id -o tsv)
          echo "object_id=$SP_OBJECT_ID" >> "$GITHUB_OUTPUT"

      - name: Bootstrap Terraform
        id: bootstrap-tf
        uses: azure/arm-deploy@v2
        with:
          scope: subscription
          region: uksouth
          template: ./bicep/main.bicep
          deploymentName: terraform-${{ inputs.environment }}
          parameters: ./bicep/environments/${{ inputs.environment }}.params.json workflowPrincipalId=${{ steps.get-sp-id.outputs.object_id }}
