worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;

        # Serve generated app data (providers, postcodes) from exported_data
        location /dash/beststartinlife/data/ {
            alias /app/data/app/;
            try_files $uri @spa_data;
        }

        location @spa_data {
            root /usr/share/nginx/html;
            try_files $uri =404;
        }

        location /dash/beststartinlife/ {
            try_files $uri $uri/ /dash/beststartinlife/index.html;
        }

        location /dash/beststartinlife/dashboard/ {
            proxy_pass http://127.0.0.1:8050/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /dash/beststartinlife/api/spatial-query {
            rewrite ^/dash/beststartinlife(/api/spatial-query.*)$ $1 break;
            proxy_pass http://127.0.0.1:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
