[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bsil-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "dagster>=1.13.1,<2",
    "dagster-postgres>=0.25,<1",
    "dagster-webserver>=1.9,<2",
    "psycopg[binary]>=3.1,<4",
    "requests>=2.31,<3",
    "beautifulsoup4>=4.12,<5",
    "pyarrow>=23.0.1,<24",
    "pyproj>=3.4,<4",
    "pyshp>=2.3,<4",
    "shapely>=2.0,<3",
    "defusedxml>=0.7,<1",
    "curl-cffi>=0.7,<1",
]

[project.optional-dependencies]
test = ["pytest>=9.0.3,<10"]

[tool.setuptools.packages.find]
include = ["bsil_pipeline*"]

[tool.pytest.ini_options]
markers = ["spot_check: tests that query the live published schema (not bsil_test)"]

[tool.dagster]
module_name = "bsil_pipeline.definitions"
